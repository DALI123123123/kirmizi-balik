<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kırmızı Balık</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #07182b;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";

// ---------------------------------------------------------------- kurulum
const BASE_W = 480, BASE_H = 720;
const SAND_Y    = BASE_H - 92;   // kum zeminin ust kenari
const SURFACE_Y = 26;            // su yuzeyi
const cv  = document.getElementById("c");
const ctx = cv.getContext("2d");

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = BASE_W * dpr;
  cv.height = BASE_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H) * 0.98;
  cv.style.width  = (BASE_W * s) + "px";
  cv.style.height = (BASE_H * s) + "px";
}
window.addEventListener("resize", resize);
resize();

// ---------------------------------------------------------------- ses
let actx = null, muted = false;
try { muted = localStorage.getItem("kbalik_mute") === "1"; } catch (e) {}

function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function blip(f0, f1, dur, type, vol) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
const sfxSwim  = () => blip(300, 640, 0.09, "sine",     0.07);  // su icinde kuyruk vurusu
const sfxScore = () => blip(700, 1500, 0.11, "sine",    0.09);  // baloncuk patlamasi
const sfxHit   = () => blip(180,  50, 0.30, "sawtooth", 0.10);
const sfxSink  = () => blip(140,  38, 0.50, "sine",     0.08);

// ---------------------------------------------------------------- durum
const READY = 0, PLAY = 1, DYING = 2, OVER = 3;
let state = READY;

const GRAVITY = 0.38;    // su icinde daha yavas batis
const THRUST  = -7.2;
const DRAG    = 0.985;   // suyun surtunmesi
const CORAL_W = 70;
const GAP_DIST = 285;

let fish, corals, score, best, ticks, spawnAt, shake, flash, bubbles, ambient, overAt;

try { best = parseInt(localStorage.getItem("kbalik_best") || "0", 10) || 0; } catch (e) { best = 0; }

function speedFor(s) { return Math.min(4.3, 2.5 + s * 0.035); }
function gapFor(s)   { return Math.max(138, 184 - s * 2.2); }

function reset() {
  fish = { x: 120, y: BASE_H * 0.42, v: 0, rot: 0, phase: 0 };
  corals = [];
  score = 0; ticks = 0; spawnAt = 0;
  shake = 0; flash = 0; bubbles = [];
  state = READY;
}

function start() { state = PLAY; spawnAt = ticks + 24; thrust(); }

function thrust() {
  fish.v = THRUST;
  sfxSwim();
  for (let i = 0; i < 3; i++) {
    bubbles.push({
      x: fish.x - 16, y: fish.y + (Math.random() - 0.5) * 8,
      vx: -0.7 - Math.random() * 0.8, vy: -0.5 - Math.random() * 0.7,
      r: 1.6 + Math.random() * 2.6, life: 45 + Math.random() * 25
    });
  }
}

function die() {
  state = DYING;
  fish.v = Math.min(fish.v, -2.8);
  shake = 14; flash = 0.7;
  sfxHit();
  for (let i = 0; i < 18; i++) {
    bubbles.push({
      x: fish.x, y: fish.y,
      vx: (Math.random() - 0.5) * 4, vy: -1 - Math.random() * 2.2,
      r: 2 + Math.random() * 5, life: 70 + Math.random() * 40
    });
  }
}

function gameOver() {
  state = OVER;
  overAt = ticks;
  sfxSink();
  if (score > best) {
    best = score;
    try { localStorage.setItem("kbalik_best", String(best)); } catch (e) {}
  }
}

// ---------------------------------------------------------------- girdi
function press() {
  audio();
  if (state === READY)     start();
  else if (state === PLAY) thrust();
  else if (state === OVER && ticks - overAt > 30) reset();
}

const MUTE_BTN = { x: BASE_W - 46, y: 18, w: 30, h: 28 };

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width  * BASE_W,
    y: (e.clientY - r.top)  / r.height * BASE_H
  };
}

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const p = toCanvas(e);
  if (p.x > MUTE_BTN.x - 8 && p.x < MUTE_BTN.x + MUTE_BTN.w + 8 &&
      p.y > MUTE_BTN.y - 8 && p.y < MUTE_BTN.y + MUTE_BTN.h + 8) {
    muted = !muted;
    try { localStorage.setItem("kbalik_mute", muted ? "1" : "0"); } catch (er) {}
    return;
  }
  press();
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
    e.preventDefault();
    if (!e.repeat) press();
  } else if (e.code === "KeyR") {
    if (state !== READY) reset();
  } else if (e.code === "KeyM") {
    muted = !muted;
    try { localStorage.setItem("kbalik_mute", muted ? "1" : "0"); } catch (er) {}
  }
});

// ---------------------------------------------------------------- guncelle
function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function updateBubbles() {
  for (const b of bubbles) {
    b.vy -= 0.012;                       // baloncuklar yukselir
    b.x += b.vx; b.y += b.vy;
    b.vx *= 0.99;
    b.life--;
  }
  bubbles = bubbles.filter(b => b.life > 0 && b.y > SURFACE_Y - 10);
}

function update() {
  ticks++;
  if (shake > 0) shake *= 0.86;
  if (flash > 0) flash -= 0.06;

  // ortam baloncuklari (arka plan)
  if (ticks % 14 === 0) {
    ambient.push({ x: Math.random() * BASE_W, y: SAND_Y - 4,
                   r: 1.5 + Math.random() * 3, sp: 0.5 + Math.random() * 0.9,
                   w: Math.random() * Math.PI * 2 });
  }
  for (const b of ambient) { b.y -= b.sp; b.w += 0.06; }
  ambient = ambient.filter(b => b.y > SURFACE_Y);

  if (state === READY) {
    fish.y = BASE_H * 0.42 + Math.sin(ticks / 20) * 11;
    fish.rot = Math.sin(ticks / 20) * 0.10;
    fish.phase += 0.16;
    updateBubbles();
    return;
  }

  // balik fizigi — suyun kaldirma/surtunme etkisiyle daha yumusak
  fish.v = Math.min((fish.v + GRAVITY) * DRAG, 10.5);
  fish.y += fish.v;
  fish.phase += state === PLAY ? (fish.v < 0 ? 0.45 : 0.18) : 0.05;
  const target = fish.v < 0 ? -0.40 : Math.min(1.30, fish.v * 0.10);
  fish.rot += (target - fish.rot) * 0.16;

  updateBubbles();

  if (state === DYING) {
    fish.rot += (Math.PI - fish.rot) * 0.06;    // olunce ters doner
    if (fish.y + 11 >= SAND_Y) { fish.y = SAND_Y - 11; gameOver(); }
    return;
  }
  if (state === OVER) return;

  // ---- PLAY
  const spd = speedFor(score);

  if (ticks >= spawnAt) {
    const gap = gapFor(score);
    const margin = 72;
    const gy = SURFACE_Y + margin + gap / 2 + Math.random() * (SAND_Y - SURFACE_Y - gap - margin * 2);
    corals.push({ x: BASE_W + 20, gy, gap, scored: false, seed: Math.random() * 100 });
    spawnAt = ticks + Math.round(GAP_DIST / spd);
  }

  for (const p of corals) {
    p.x -= spd;
    if (!p.scored && p.x + CORAL_W < fish.x) {
      p.scored = true; score++; sfxScore();
      bubbles.push({ x: fish.x + 6, y: fish.y - 8, vx: 0.4, vy: -1.2, r: 3, life: 40 });
    }
  }
  corals = corals.filter(p => p.x + CORAL_W > -10);

  // carpisma
  if (fish.y + 11 >= SAND_Y) { fish.y = SAND_Y - 11; die(); gameOver(); return; }
  if (fish.y < SURFACE_Y + 12) {                  // su yuzeyi: cikamaz ama olmez
    fish.y = SURFACE_Y + 12;
    fish.v = Math.max(fish.v, -1);
  }

  for (const p of corals) {
    const topH = p.gy - p.gap / 2;
    const botY = p.gy + p.gap / 2;
    if (circleHitsRect(fish.x, fish.y, 11, p.x, -100, CORAL_W, topH + 100) ||
        circleHitsRect(fish.x, fish.y, 11, p.x, botY, CORAL_W, SAND_Y - botY)) {
      die();
      return;
    }
  }
}

// ---------------------------------------------------------------- cizim
ambient = [];
const weeds = Array.from({ length: 14 }, () => ({
  x: Math.random() * BASE_W, h: 30 + Math.random() * 55,
  w: 5 + Math.random() * 5, p: Math.random() * Math.PI * 2, sp: 0.25 + Math.random() * 0.3
}));
const farRocks = Array.from({ length: 7 }, () => ({
  x: Math.random() * BASE_W, w: 60 + Math.random() * 90, h: 30 + Math.random() * 55
}));

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawWater() {
  const g = ctx.createLinearGradient(0, 0, 0, SAND_Y);
  g.addColorStop(0,    "#2fa8d8");
  g.addColorStop(0.45, "#1d7fb8");
  g.addColorStop(1,    "#0d4a80");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, BASE_W, SAND_Y);

  // isik huzmeleri
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 4; i++) {
    const sx = 70 + i * 120 + Math.sin(ticks / 130 + i) * 26;
    const gr = ctx.createLinearGradient(sx, SURFACE_Y, sx + 60, SAND_Y);
    gr.addColorStop(0, "rgba(200,245,255,.16)");
    gr.addColorStop(1, "rgba(200,245,255,0)");
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(sx - 16, SURFACE_Y);
    ctx.lineTo(sx + 20, SURFACE_Y);
    ctx.lineTo(sx + 92, SAND_Y);
    ctx.lineTo(sx + 8,  SAND_Y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // arka plandaki kayalar
  ctx.fillStyle = "rgba(8,58,96,.55)";
  for (const r of farRocks) {
    ctx.beginPath();
    ctx.ellipse(r.x, SAND_Y + 6, r.w / 2, r.h, 0, Math.PI, 0);
    ctx.fill();
  }

  // su yuzeyi
  ctx.fillStyle = "#8fe3f5";
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(BASE_W, 0); ctx.lineTo(BASE_W, SURFACE_Y);
  for (let x = BASE_W; x >= 0; x -= 20) {
    ctx.lineTo(x, SURFACE_Y + Math.sin(x / 34 + ticks / 22) * 4);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.45)";
  for (let x = 0; x < BASE_W; x += 20) {
    ctx.fillRect(x, SURFACE_Y - 4 + Math.sin(x / 34 + ticks / 22) * 4, 10, 2);
  }

  // ortam baloncuklari
  ctx.strokeStyle = "rgba(255,255,255,.40)"; ctx.lineWidth = 1.2;
  for (const b of ambient) {
    ctx.beginPath();
    ctx.arc(b.x + Math.sin(b.w) * 7, b.y, b.r, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawSand() {
  const g = ctx.createLinearGradient(0, SAND_Y, 0, BASE_H);
  g.addColorStop(0, "#e8d9a0");
  g.addColorStop(1, "#c9b271");
  ctx.fillStyle = g;
  ctx.fillRect(0, SAND_Y, BASE_W, BASE_H - SAND_Y);

  // kum tepecikleri
  ctx.fillStyle = "#f0e3b4";
  ctx.beginPath();
  ctx.moveTo(0, SAND_Y + 6);
  const off = (ticks * speedFor(score) * 0.5) % 90;
  for (let x = -90; x <= BASE_W + 90; x += 90) {
    ctx.quadraticCurveTo(x + 45 - off, SAND_Y - 9, x + 90 - off, SAND_Y + 6);
  }
  ctx.lineTo(BASE_W, BASE_H); ctx.lineTo(0, BASE_H);
  ctx.closePath(); ctx.fill();

  // yosunlar
  const woff = (ticks * speedFor(score) * 0.5) % BASE_W;
  for (const w of weeds) {
    let x = w.x - woff;
    if (x < -20) x += BASE_W;
    const sway = Math.sin(ticks / 30 * w.sp + w.p) * 9;
    ctx.strokeStyle = "#2e8b57"; ctx.lineWidth = w.w; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, SAND_Y + 8);
    ctx.quadraticCurveTo(x + sway * 0.5, SAND_Y - w.h * 0.5, x + sway, SAND_Y - w.h);
    ctx.stroke();
  }

  ctx.fillStyle = "rgba(0,0,0,.12)";
  ctx.fillRect(0, SAND_Y, BASE_W, 4);
}

// tirtikli kenarli mercan sutunu
function coralColumn(x, yTop, yBot, seed) {
  const g = ctx.createLinearGradient(x, 0, x + CORAL_W, 0);
  g.addColorStop(0,    "#1f6b4a");
  g.addColorStop(0.30, "#57c98c");
  g.addColorStop(0.62, "#2f9c68");
  g.addColorStop(1,    "#12503a");

  ctx.beginPath();
  ctx.moveTo(x, yTop);
  for (let y = yTop; y < yBot; y += 24) {
    const b = Math.sin((y + seed) / 24) * 3.5;
    ctx.quadraticCurveTo(x - 4 + b, y + 12, x, Math.min(y + 24, yBot));
  }
  ctx.lineTo(x + CORAL_W, yBot);
  for (let y = yBot; y > yTop; y -= 24) {
    const b = Math.sin((y + seed) / 24) * 3.5;
    ctx.quadraticCurveTo(x + CORAL_W + 4 - b, y - 12, x + CORAL_W, Math.max(y - 24, yTop));
  }
  ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(2,40,28,.45)"; ctx.lineWidth = 2; ctx.stroke();

  // benekler
  ctx.fillStyle = "rgba(255,255,255,.16)";
  for (let y = yTop + 16; y < yBot - 8; y += 34) {
    ctx.beginPath();
    ctx.arc(x + 18 + Math.sin((y + seed) / 40) * 12, y, 3.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function coralHead(x, y, dir, seed) {   // dir: +1 asagi bakan agiz, -1 yukari
  const g = ctx.createLinearGradient(x, 0, x + CORAL_W, 0);
  g.addColorStop(0, "#2a7d57"); g.addColorStop(0.35, "#6ad99b"); g.addColorStop(1, "#175c40");
  ctx.fillStyle = g;
  roundRect(x - 6, dir > 0 ? y - 26 : y, CORAL_W + 12, 26, 9); ctx.fill();
  ctx.strokeStyle = "rgba(2,40,28,.45)"; ctx.lineWidth = 2;
  roundRect(x - 6, dir > 0 ? y - 26 : y, CORAL_W + 12, 26, 9); ctx.stroke();

  // mercan tomurcuklari
  ctx.fillStyle = "#7de3aa";
  for (let i = 0; i < 3; i++) {
    const bx = x + 14 + i * 21 + Math.sin(seed + i) * 3;
    const by = dir > 0 ? y - 1 : y + 1;
    ctx.beginPath(); ctx.arc(bx, by, 6.5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawCoral(p) {
  const topH = p.gy - p.gap / 2;
  const botY = p.gy + p.gap / 2;
  coralColumn(p.x, -4, topH - 22, p.seed);
  coralColumn(p.x, botY + 22, SAND_Y, p.seed + 13);
  coralHead(p.x, topH, 1, p.seed);
  coralHead(p.x, botY, -1, p.seed);
}

function drawFish(x, y, rot, phase) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  const wag = Math.sin(phase);

  // kuyruk
  ctx.fillStyle = "#c62828";
  ctx.beginPath();
  ctx.moveTo(-12, 0);
  ctx.lineTo(-27, -10 + wag * 7);
  ctx.quadraticCurveTo(-19, 0, -27, 10 + wag * 7);
  ctx.closePath(); ctx.fill();

  // sirt ve karin yuzgeci
  ctx.fillStyle = "#d93636";
  ctx.beginPath();
  ctx.moveTo(-4, -9); ctx.quadraticCurveTo(0, -23, 11, -8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3, 8); ctx.quadraticCurveTo(-1, 19, 8, 9);
  ctx.closePath(); ctx.fill();

  // govde
  const g = ctx.createRadialGradient(-2, -5, 3, 0, 0, 22);
  g.addColorStop(0, "#ff8a72");
  g.addColorStop(0.55, "#f4402f");
  g.addColorStop(1, "#c1231a");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(70,10,5,.40)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2); ctx.stroke();

  // solungac cizgisi
  ctx.strokeStyle = "rgba(120,20,10,.45)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(4, 0, 8, -1.1, 1.1); ctx.stroke();

  // yan yuzgec
  ctx.fillStyle = "rgba(255,150,130,.92)";
  ctx.beginPath();
  ctx.ellipse(1, 6, 8, 4.2, 0.45 + wag * 0.28, 0, Math.PI * 2);
  ctx.fill();

  // goz
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(10, -3.5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(70,10,5,.40)"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(10, -3.5, 5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.arc(11.6, -3.5, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath(); ctx.arc(10.4, -5, 1, 0, Math.PI * 2); ctx.fill();

  // agiz
  ctx.strokeStyle = "rgba(90,10,5,.55)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(19, 3, 3, -1.6, 0.6); ctx.stroke();

  ctx.restore();
}

function drawBubbles() {
  ctx.lineWidth = 1.3;
  for (const b of bubbles) {
    const a = Math.min(1, b.life / 40);
    ctx.strokeStyle = "rgba(235,250,255," + (0.75 * a) + ")";
    ctx.fillStyle   = "rgba(180,230,255," + (0.18 * a) + ")";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
}

function bigText(txt, x, y, size, fill) {
  ctx.font = "700 " + size + "px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = Math.max(4, size / 8);
  ctx.strokeStyle = "rgba(0,20,35,.65)"; ctx.lineJoin = "round";
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill || "#fff";
  ctx.fillText(txt, x, y);
}

function drawMuteButton() {
  const b = MUTE_BTN;
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(b.x + 2,  b.y + 10); ctx.lineTo(b.x + 9,  b.y + 10);
  ctx.lineTo(b.x + 17, b.y + 3);  ctx.lineTo(b.x + 17, b.y + 25);
  ctx.lineTo(b.x + 9,  b.y + 18); ctx.lineTo(b.x + 2,  b.y + 18);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  if (muted) {
    ctx.strokeStyle = "#ff6b6b";
    ctx.beginPath();
    ctx.moveTo(b.x + 21, b.y + 8); ctx.lineTo(b.x + 30, b.y + 20);
    ctx.moveTo(b.x + 30, b.y + 8); ctx.lineTo(b.x + 21, b.y + 20);
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(b.x + 18, b.y + 14, 6,  -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x + 18, b.y + 14, 11, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(6,32,56,.85)";
  roundRect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = "rgba(160,235,255,.30)"; ctx.lineWidth = 2;
  roundRect(x, y, w, h, 16); ctx.stroke();
}

function medalFor(s) {
  if (s >= 40) return { c1: "#f6f2ff", c2: "#c9b6e8", t: "İNCİ"    };
  if (s >= 25) return { c1: "#ffe37a", c2: "#e0a92b", t: "ALTIN"   };
  if (s >= 12) return { c1: "#e6e9ee", c2: "#a3adba", t: "GÜMÜŞ"   };
  if (s >= 5)  return { c1: "#ffd0b0", c2: "#c9713f", t: "MERCAN"  };
  return null;
}

function draw() {
  ctx.save();
  if (shake > 0.4) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  drawWater();
  for (const p of corals) drawCoral(p);
  drawSand();
  drawBubbles();
  drawFish(fish.x, fish.y, fish.rot, fish.phase);

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = "rgba(255,240,230," + Math.max(0, flash) + ")";
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  if (state === PLAY || state === DYING) bigText(String(score), BASE_W / 2, 100, 62);

  drawMuteButton();

  if (state === READY) {
    bigText("KIRMIZI BALIK", BASE_W / 2, 196, 44, "#ff8a72");
    bigText("Rekor: " + best, BASE_W / 2, 248, 24);
    const pulse = 0.5 + Math.sin(ticks / 14) * 0.5;
    ctx.globalAlpha = 0.55 + pulse * 0.45;
    bigText("BOŞLUK  ·  TIKLA", BASE_W / 2, BASE_H - 190, 30);
    ctx.globalAlpha = 1;
    bigText("kuyruk vurup yüzmek için", BASE_W / 2, BASE_H - 152, 19);
  }

  if (state === OVER) {
    const w = 300, h = 250, x = (BASE_W - w) / 2, y = 168;
    panel(x, y, w, h);
    bigText("OYUN BİTTİ", BASE_W / 2, y + 44, 34, "#ff9a6b");

    const m = medalFor(score);
    if (m) {
      const mx = x + 62, my = y + 128;
      const g = ctx.createRadialGradient(mx - 6, my - 8, 3, mx, my, 30);
      g.addColorStop(0, m.c1); g.addColorStop(1, m.c2);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.stroke();
      ctx.font = "700 11px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.fillText(m.t, mx, my + 1);
    }

    const tx = m ? x + 196 : BASE_W / 2;
    bigText("SKOR", tx, y + 100, 18, "#bfe6f5");
    bigText(String(score), tx, y + 132, 42);
    bigText("REKOR", tx, y + 168, 18, "#bfe6f5");
    bigText(String(best), tx, y + 196, 30, score >= best && score > 0 ? "#ffe066" : "#fff");

    if (ticks - overAt > 30) {
      const pulse = 0.5 + Math.sin(ticks / 12) * 0.5;
      ctx.globalAlpha = 0.55 + pulse * 0.45;
      bigText("BOŞLUK / R  →  tekrar oyna", BASE_W / 2, y + h + 52, 22);
      ctx.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------- dongu
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;

function frame(t) {
  acc += Math.min(t - last, 250);
  last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

reset();
requestAnimationFrame(frame);
try { window.focus(); } catch (e) {}
})();
</script>
</body>
</html>
